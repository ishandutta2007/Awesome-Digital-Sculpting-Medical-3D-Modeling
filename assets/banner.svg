<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Mesh Wireframe Glow -->
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 14s ease-in-out infinite alternate;
      }
      .pulse-wire {
        animation: pulseWire 6s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scanMove 7s linear infinite;
      }
      .pulse-pill {
        animation: pillHover 5s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(90px, 50px) scale(1.2); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        100% { transform: translate(-80px, -40px) scale(0.9); }
      }
      @keyframes pulseWire {
        0% { opacity: 0.25; stroke-width: 1.2; }
        50% { opacity: 0.55; stroke-width: 1.8; }
        100% { opacity: 0.25; stroke-width: 1.2; }
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes pillHover {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Deep Dark Cybernetic/Biomedical Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g filter="url(#orbGlow)">
    <circle class="glow-orb-1" cx="220" cy="140" r="140" fill="#0284c7" opacity="0.25" />
    <circle class="glow-orb-2" cx="980" cy="260" r="150" fill="#7c3aed" opacity="0.28" />
    <circle class="glow-orb-1" cx="620" cy="340" r="120" fill="#0d9488" opacity="0.18" />
  </g>

  <!-- High-Tech Medical Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" stroke="#38bdf8" stroke-width="1" />
    <path d="M 100,0 L 100,420 M 200,0 L 200,420 M 300,0 L 300,420 M 400,0 L 400,420 M 500,0 L 500,420 M 600,0 L 600,420 M 700,0 L 700,420 M 800,0 L 800,420 M 900,0 L 900,420 M 1000,0 L 1000,420 M 1100,0 L 1100,420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Polygonal Mesh (Right Foreground Side, Behind Text Area) -->
  <g class="pulse-wire" stroke="url(#meshGrad)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 3D Organic/Cranial/Mesh Tessellation -->
    <polygon points="980,60 1060,110 1020,170 940,130" />
    <polygon points="1060,110 1150,150 1110,230 1020,170" />
    <polygon points="1020,170 1110,230 1070,310 990,260" />
    <polygon points="940,130 1020,170 990,260 900,210" />
    <polygon points="900,210 990,260 950,340 870,290" />
    <polygon points="990,260 1070,310 1020,380 950,340" />
    <polygon points="850,110 940,130 900,210 820,170" />
    <polygon points="820,170 900,210 870,290 790,240" />
    <!-- Subtle Connectors -->
    <line x1="980" y1="60" x2="900" y2="90" />
    <line x1="900" y1="90" x2="850" y2="110" />
    <line x1="1150" y1="150" x2="1180" y2="240" />
    <line x1="1110" y1="230" x2="1180" y2="240" />
    <line x1="1180" y1="240" x2="1130" y2="330" />
    <line x1="1070" y1="310" x2="1130" y2="330" />
    <!-- Node Vertices -->
    <circle cx="1020" cy="170" r="3.5" fill="#38bdf8" />
    <circle cx="990" cy="260" r="4" fill="#818cf8" />
    <circle cx="940" cy="130" r="3" fill="#c084fc" />
    <circle cx="900" cy="210" r="3.5" fill="#38bdf8" />
    <circle cx="1060" cy="110" r="3" fill="#818cf8" />
    <circle cx="1110" cy="230" r="3.5" fill="#c084fc" />
    <circle cx="950" cy="340" r="3" fill="#38bdf8" />
    <circle cx="870" cy="290" r="3" fill="#818cf8" />
  </g>

  <!-- CT / Laser Slice Scanning Line Effect -->
  <g class="scan-line" opacity="0.7">
    <line x1="40" y1="20" x2="1160" y2="20" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)" />
    <polygon points="40,20 1160,20 1160,26 40,26" fill="#00f2fe" opacity="0.15" />
  </g>

  <!-- Foreground Content Area: Clear, Crisp, High Contrast -->
  <g transform="translate(70, 75)">
    <!-- Category Super-Title / Ecosystem Tag -->
    <g transform="translate(0, 0)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="30" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED 3D &amp; BIOMEDICAL ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foregrounded & Gradient Highlighted) -->
    <text x="0" y="80" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Digital Sculpting
    </text>
    <text x="0" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
      &amp; Medical 3D Modeling
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Production Sculpting Suites • DICOM-to-STL Mesh Reconstruction • Retopology • Spatial &amp; WebGL VR
    </text>

    <!-- Feature Badges / Highlights (Interactive Look) -->
    <g class="pulse-pill" transform="translate(0, 205)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🎨 Digital Sculpting</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🏥 DICOM &amp; CT Slicing</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(395, 0)">
        <rect width="195" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="22" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Dynamic Quad Remesh</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🖨️ Watertight 3D Print</text>
      </g>
    </g>
  </g>

  <!-- Frame Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.35" />
</svg>
